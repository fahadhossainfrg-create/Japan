name: Apply exact WorldAtlas map and external era sources

on:
  push:
    paths:
      - ".github/workflows/apply-exact-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact map and independent evidence images
        run: |
          set -e
          mkdir -p assets/eras
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://www.worldatlas.com/upload/4a/5a/54/jp-01.jpg" -o assets/japan-worldatlas.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/T%C5%8Ddai-ji_Daibutsuden.jpg?width=1200" -o assets/eras/nara-todaiji.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Phoenix%20Hall%2C%20Byodo-in.jpg?width=1200" -o assets/eras/heian-byodoin.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Great_Buddha.jpg?width=1200" -o assets/eras/kamakura-buddha.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Ginkaku-ji%2C%20Kyoto.jpg?width=1000" -o assets/eras/muromachi-ginkakuji.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Osaka_Castle_-_Japan.jpg?width=1200" -o assets/eras/sengoku-osaka-castle.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Imperial_palace_moat_and_guard_tower.jpg?width=1200" -o assets/eras/tokugawa-edo-castle.jpg
          curl -L --fail --retry 4 -A "Mozilla/5.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Emperor_Meiji_in_1873.jpg?width=960" -o assets/eras/meiji-emperor.jpg
          test -s assets/japan-worldatlas.jpg
          for f in assets/eras/*.jpg; do test -s "$f"; done

      - name: Replace map and era images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          css=r"""
          <style id="exact-worldatlas-map">
          .map-explorer.map-exact{display:block!important;margin:22px 0 30px}
          .map-exact .city-radio{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
          .map-exact .map-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:22px;align-items:start}
          .map-exact .map-canvas{overflow:hidden;border-radius:24px;background:#6cc5ec;border:1px solid rgba(31,64,94,.18);box-shadow:0 18px 42px rgba(31,41,55,.14)}
          .map-exact .map-canvas img{display:block;width:100%;height:auto;background:#6cc5ec}
          .map-exact .map-credit{padding:10px 14px;background:rgba(255,255,255,.94);font-size:.78rem;line-height:1.45;color:#334155;border-top:1px solid rgba(31,64,94,.12)}
          .map-exact .city-card{display:flex;flex-direction:column;padding:22px;background:linear-gradient(145deg,#102a26 0%,#173c35 58%,#0f2421 100%);color:#fff;border-radius:24px;border:1px solid rgba(255,209,126,.14);box-shadow:0 18px 42px rgba(0,0,0,.12);position:sticky;top:84px}
          .map-exact .city-card h3{margin:0 0 10px;color:#fff}
          .map-exact .map-instruction{padding:11px 13px;margin:0 0 14px;border-radius:14px;background:rgba(255,209,126,.12);color:#f6efe4;line-height:1.5;border:1px solid rgba(255,209,126,.18)}
          .map-exact .city-slider{display:flex;gap:12px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory}
          .map-exact .city-slider::-webkit-scrollbar{height:8px}.map-exact .city-slider::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:999px}
          .map-exact .city-chip{flex:0 0 160px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.18s ease}
          .map-exact .city-chip b{color:#fff;font-size:1rem;display:block}.map-exact .city-chip span{color:#d1d5db;font-size:.8rem;margin-top:3px}.map-exact .city-chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
          .map-exact .city-details{min-height:330px;padding:20px;margin-top:14px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}
          .map-exact .city-detail{display:none}.map-exact .city-default{display:block;color:#f8fafc;line-height:1.6}.map-exact .city-kicker{display:inline-block;margin-bottom:8px;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#ffd17e}
          .map-exact .city-detail h3{font-size:1.62rem;margin:0 0 5px;color:#fff}.map-exact .city-period{font-size:.9rem;font-weight:700;color:#ffd17e;margin-bottom:14px}.map-exact .city-detail h4{font-size:.84rem;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em;color:#ffd17e}.map-exact .city-detail p{margin:0;color:#f8fafc;line-height:1.62}
          #map-city-kyoto:checked~.map-layout .detail-kyoto,#map-city-nara:checked~.map-layout .detail-nara,#map-city-osaka:checked~.map-layout .detail-osaka,#map-city-edo:checked~.map-layout .detail-edo,#map-city-kamakura:checked~.map-layout .detail-kamakura,#map-city-nagasaki:checked~.map-layout .detail-nagasaki{display:block}
          #map-city-kyoto:checked~.map-layout .city-default,#map-city-nara:checked~.map-layout .city-default,#map-city-osaka:checked~.map-layout .city-default,#map-city-edo:checked~.map-layout .city-default,#map-city-kamakura:checked~.map-layout .city-default,#map-city-nagasaki:checked~.map-layout .city-default{display:none}
          #map-city-kyoto:checked~.map-layout .chip-kyoto,#map-city-nara:checked~.map-layout .chip-nara,#map-city-osaka:checked~.map-layout .chip-osaka,#map-city-edo:checked~.map-layout .chip-edo,#map-city-kamakura:checked~.map-layout .chip-kamakura,#map-city-nagasaki:checked~.map-layout .chip-nagasaki{background:#ffd17e;border-color:#ffd17e;box-shadow:0 10px 22px rgba(0,0,0,.18)}
          #map-city-kyoto:checked~.map-layout .chip-kyoto b,#map-city-kyoto:checked~.map-layout .chip-kyoto span,#map-city-nara:checked~.map-layout .chip-nara b,#map-city-nara:checked~.map-layout .chip-nara span,#map-city-osaka:checked~.map-layout .chip-osaka b,#map-city-osaka:checked~.map-layout .chip-osaka span,#map-city-edo:checked~.map-layout .chip-edo b,#map-city-edo:checked~.map-layout .chip-edo span,#map-city-kamakura:checked~.map-layout .chip-kamakura b,#map-city-kamakura:checked~.map-layout .chip-kamakura span,#map-city-nagasaki:checked~.map-layout .chip-nagasaki b,#map-city-nagasaki:checked~.map-layout .chip-nagasaki span{color:#26180f}
          @media(max-width:980px){.map-exact .map-layout{grid-template-columns:1fr}.map-exact .city-card{position:static}.map-exact .city-chip{flex-basis:150px}}
          </style>
          """
          if 'id="exact-worldatlas-map"' not in s:
              s=s.replace("</head>",css+"\n</head>",1)

          city_details="""
          <div class="city-default"><b>Select a city from the slider.</b><br><br>The map itself stays unchanged. The historical information appears here.</div>
          <article class="city-detail detail-kyoto"><span class="city-kicker">City focus</span><h3>Kyoto / Heian-kyo</h3><div class="city-period">Imperial capital • 794–1868</div><h4>Why it mattered</h4><p>Kyoto was the home of the emperor and court. It remained the symbolic heart of Japan even when shoguns ruled from other cities.</p><h4>Historical role</h4><p>From the Heian period onward, Kyoto shaped literature, religion, architecture and court ceremony. Warrior governments often ruled in the emperor’s name, so Kyoto remained politically important even when military power shifted elsewhere.</p></article>
          <article class="city-detail detail-nara"><span class="city-kicker">City focus</span><h3>Nara</h3><div class="city-period">Imperial capital • 710–794</div><h4>Why it mattered</h4><p>Nara was Japan’s first permanent capital and a major centre of Buddhism and early state formation.</p><h4>Historical role</h4><p>Nara was planned on Chinese lines and became a centre of temples, learning and government. It helps explain the development of stronger central authority before warrior government.</p></article>
          <article class="city-detail detail-osaka"><span class="city-kicker">City focus</span><h3>Osaka</h3><div class="city-period">Castle town & commercial centre</div><h4>Why it mattered</h4><p>Osaka became vital during the age of unification and later one of Japan’s busiest commercial centres.</p><h4>Historical role</h4><p>Toyotomi Hideyoshi made Osaka a power base through Osaka Castle. Under Tokugawa rule, Osaka became a major centre for rice, finance and large-scale exchange.</p></article>
          <article class="city-detail detail-edo"><span class="city-kicker">City focus</span><h3>Edo / Tokyo</h3><div class="city-period">Tokugawa government • 1603–1868</div><h4>Why it mattered</h4><p>Edo was the headquarters of the Tokugawa shogunate and the centre of political and military administration.</p><h4>Historical role</h4><p>Tokugawa Ieyasu based his government here. Alternate attendance brought daimyo regularly to Edo. After 1868, Edo was renamed Tokyo and became the imperial capital.</p></article>
          <article class="city-detail detail-kamakura"><span class="city-kicker">City focus</span><h3>Kamakura</h3><div class="city-period">First long-lasting warrior government • from 1185</div><h4>Why it mattered</h4><p>Kamakura was the seat of Japan’s first enduring shogunate and represents the rise of warrior rule.</p><h4>Historical role</h4><p>Minamoto no Yoritomo based his bakufu here, away from the imperial court in Kyoto, marking a major shift toward military government.</p></article>
          <article class="city-detail detail-nagasaki"><span class="city-kicker">City focus</span><h3>Nagasaki</h3><div class="city-period">Foreign-contact port • Tokugawa era</div><h4>Why it mattered</h4><p>Nagasaki remained one of Japan’s most important controlled gateways to the outside world.</p><h4>Historical role</h4><p>Under Tokugawa restrictions, limited Dutch and Chinese trade continued through Nagasaki, especially through Dejima.</p></article>
          """

          block=f"""
          <div class="map-explorer map-exact reveal">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-kyoto" checked>
            <input class="city-radio" type="radio" name="historic-city" id="map-city-nara">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-osaka">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-edo">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-kamakura">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-nagasaki">
            <div class="map-layout">
              <div class="map-canvas">
                <img src="assets/japan-worldatlas.jpg" alt="WorldAtlas physical map of Japan with cities and physical features">
                <div class="map-credit"><b>Map used exactly as supplied.</b> No extra text, dots, city markers or overlays have been added. Source shown on the map: WorldAtlas.com.</div>
              </div>
              <div class="city-card">
                <h3>Major Cities of Historical Japan</h3>
                <div class="map-instruction">Use the <b>city slider</b> to explore historical significance. Nothing is added on top of the map.</div>
                <div class="city-slider" role="tablist" aria-label="Major cities slider">
                  <label class="city-chip chip-kyoto" for="map-city-kyoto"><b>Kyoto</b><span>Imperial capital</span></label>
                  <label class="city-chip chip-nara" for="map-city-nara"><b>Nara</b><span>First permanent capital</span></label>
                  <label class="city-chip chip-osaka" for="map-city-osaka"><b>Osaka</b><span>Trade & castle city</span></label>
                  <label class="city-chip chip-edo" for="map-city-edo"><b>Edo / Tokyo</b><span>Tokugawa government</span></label>
                  <label class="city-chip chip-kamakura" for="map-city-kamakura"><b>Kamakura</b><span>First shogunate centre</span></label>
                  <label class="city-chip chip-nagasaki" for="map-city-nagasaki"><b>Nagasaki</b><span>Foreign-contact port</span></label>
                </div>
                <div class="city-details">{city_details}</div>
              </div>
            </div>
          </div>
          """

          pat=r'<div class="map-explorer[^>]*>.*?</div>\s*<div class="knowledge reveal"><h3>Know Japan before you enter the shogunate</h3>'
          s,n=re.subn(pat,block+'\n<div class="knowledge reveal"><h3>Know Japan before you enter the shogunate</h3>',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit("Map block not found")

          # Replace era evidence images with independently sourced files.
          era_imgs={
            'panel-nara':('assets/eras/nara-todaiji.jpg','Tōdai-ji Daibutsuden, Nara','Wikimedia Commons — Tōdai-ji Daibutsuden.jpg'),
            'panel-heian':('assets/eras/heian-byodoin.jpg','Phoenix Hall, Byōdō-in','Wikimedia Commons — Phoenix Hall, Byodo-in.jpg'),
            'panel-kamakura':('assets/eras/kamakura-buddha.jpg','Great Buddha of Kamakura','Wikimedia Commons — Great Buddha.jpg'),
            'panel-muromachi':('assets/eras/muromachi-ginkakuji.jpg','Ginkaku-ji, Kyoto','Wikimedia Commons — Ginkaku-ji, Kyoto.jpg'),
            'panel-sengoku':('assets/eras/sengoku-osaka-castle.jpg','Osaka Castle','Wikimedia Commons — Osaka Castle - Japan.jpg'),
            'panel-tokugawaEra':('assets/eras/tokugawa-edo-castle.jpg','Edo Castle moat and guard tower','Wikimedia Commons — Imperial palace moat and guard tower.jpg'),
            'panel-meijiEra':('assets/eras/meiji-emperor.jpg','Emperor Meiji, 1873','Wikimedia Commons — Emperor Meiji in 1873.jpg')
          }
          for cls,(src,caption,credit) in era_imgs.items():
              pat=rf'(<article class="era-panel {re.escape(cls)}">\s*<div class="era-image-wrap"><img )src="[^"]+" alt="[^"]*"'
              s,n=re.subn(pat,rf'\1src="{src}" alt="{caption}"',s,count=1)
              if n!=1:
                  raise SystemExit(f"Could not replace image for {cls}")
              # Replace the visible evidence caption under the picture.
              pat2=rf'(<article class="era-panel {re.escape(cls)}">[\s\S]*?<div class="era-photo-label"><span>PICTURE EVIDENCE</span><b>)[^<]*(</b>)'
              s=re.sub(pat2,rf'\1{caption}\2',s,count=1)
              # Replace source acknowledgement for this panel.
              pat3=rf'(<article class="era-panel {re.escape(cls)}">[\s\S]*?<div class="era-source-note">)[^<]*(</div>)'
              s=re.sub(pat3,rf'\1Source: {credit}\2',s,count=1)

          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit exact map and evidence sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/japan-worldatlas.jpg assets/eras
          git commit -m "Use exact supplied map and independent era evidence sources"
          git push
