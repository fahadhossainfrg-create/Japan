name: Repair Japan interactive site

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-site.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          # Fail-open visibility: content remains visible even if animation JS fails.
          html = html.replace(
              ".reveal{opacity:0;transform:translateY(22px);transition:.65s ease}.reveal.on{opacity:1;transform:none}",
              ".reveal{opacity:1;transform:none;transition:.65s ease}.reveal.on{opacity:1;transform:none}"
          )
          html = html.replace(
              ".reveal{opacity:0;transform:translateY(32px) scale(.99);filter:blur(4px);transition:opacity .72s var(--ease),transform .72s var(--ease),filter .72s ease;transition-delay:var(--delay,0ms)}.reveal.on{opacity:1;transform:none;filter:none}",
              ".reveal{opacity:1;transform:none;filter:none;transition:opacity .72s var(--ease),transform .72s var(--ease),filter .72s ease;transition-delay:var(--delay,0ms)}.reveal.on{opacity:1;transform:none;filter:none}"
          )

          era = {
            "nara": {
              "range":"710–794 • Nara period",
              "title":"Nara: central government and state Buddhism",
              "summary":"Nara became a planned imperial capital in 710. Japan drew heavily on Chinese and Korean models of centralised government, writing, Buddhism and Confucian ideas. Large temples linked religion with the authority of the state.",
              "points":[
                "Nara was planned on a grid inspired by the Chinese capital Chang’an.",
                "Chinese characters were adapted for Japanese writing, while Buddhism became increasingly important in court and state life.",
                "The period shows Japan borrowing foreign ideas and reshaping them for local use."
              ],
              "image":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/T%C5%8Ddai-ji_Kon-d%C5%8D.jpg/1200px-T%C5%8Ddai-ji_Kon-d%C5%8D.jpg",
              "evidenceTitle":"Tōdai-ji, Nara",
              "evidence":"Tōdai-ji was founded in the Nara period and became a major centre of state Buddhism. The site is evidence of Nara-period religious power, although surviving buildings have been rebuilt over time.",
              "source":"Source acknowledgement: Wikimedia Commons / Tōdai-ji."
            },
            "heian": {
              "range":"794–1185 • Heian period",
              "title":"Heian: imperial Kyoto and the rise of warrior power",
              "summary":"The imperial capital moved to Kyoto, then called Heian-kyo. Court culture flourished, but over time powerful families relied more heavily on regional warlords and armed retainers.",
              "points":[
                "Kyoto had strong communication and supply routes.",
                "The emperor and court remained central symbols of authority.",
                "Toward the end of the period, rival families backed by warriors competed for control."
              ],
              "image":"https://commons.wikimedia.org/wiki/Special:FilePath/Phoenix%20Hall%20in%20Byodo-in%20Temple%2C%20Ujirenge%20Uji%20city%202026.jpg?width=1200",
              "evidenceTitle":"Phoenix Hall, Byōdō-in",
              "evidence":"The Phoenix Hall dates to the Heian period and survives near Kyoto. Its architecture and Buddhist setting provide evidence of elite culture and religion.",
              "source":"Source acknowledgement: Wikimedia Commons / Byōdō-in."
            },
            "kamakura": {
              "range":"1185–1333 • Kamakura bakufu",
              "title":"Kamakura: the first long-lasting warrior government",
              "summary":"After civil war, Minamoto no Yoritomo became the dominant warlord. He ruled from Kamakura and was recognised as shogun while the emperor remained in Kyoto.",
              "points":[
                "Daimyo and samurai gained power as imperial control weakened.",
                "The shogun appointed provincial administrators, land stewards and military protectors.",
                "The government faced the Mongol invasions of 1274 and 1281."
              ],
              "image":"https://commons.wikimedia.org/wiki/Special:FilePath/The%20Great%20Buddha%20of%20Kamakura%20%28Daibutsu%29.jpg?width=1200",
              "evidenceTitle":"Great Buddha of Kamakura",
              "evidence":"The bronze Great Buddha dates from the Kamakura period and shows that warrior rule existed alongside powerful Buddhist institutions.",
              "source":"Source acknowledgement: Wikimedia Commons / Great Buddha of Kamakura."
            },
            "muromachi": {
              "range":"1338–1573 • Muromachi / Ashikaga",
              "title":"Muromachi: shoguns in Kyoto, stronger regional daimyo",
              "summary":"Ashikaga leaders established a new bakufu in Kyoto. Over time, regional daimyo became increasingly independent while important cultural forms developed.",
              "points":[
                "The shogunate was based in the Muromachi district of Kyoto.",
                "The fifteenth and sixteenth centuries saw prolonged civil conflict.",
                "European traders began appearing during the later period, bringing new goods and firearms."
              ],
              "image":"https://commons.wikimedia.org/wiki/Special:FilePath/GinkakujiPavilion.jpg?width=1200",
              "evidenceTitle":"Ginkaku-ji, Kyoto",
              "evidence":"The Silver Pavilion complex is associated with Ashikaga Yoshimasa and late Muromachi elite culture.",
              "source":"Source acknowledgement: Wikimedia Commons / Ginkaku-ji."
            },
            "sengoku": {
              "range":"c.1467–1600 • Warring States",
              "title":"Warring States: competing domains and military innovation",
              "summary":"Central authority fractured and daimyo fought to defend or enlarge their territories. Oda Nobunaga, Toyotomi Hideyoshi and Tokugawa Ieyasu gradually brought competing domains under stronger control.",
              "points":[
                "Castle building expanded as warlords needed defensible political centres.",
                "Nobunaga took Kyoto in 1568 and used new military tactics and firearms.",
                "Hideyoshi extended unification; after his death, Ieyasu defeated rivals at Sekigahara in 1600."
              ],
              "image":"https://commons.wikimedia.org/wiki/Special:FilePath/Azuchi%20Castle%20Ruins.jpg?width=1200",
              "evidenceTitle":"Azuchi Castle ruins",
              "evidence":"The stone remains of Azuchi Castle provide physical evidence of castle-centred warlord power in the late sixteenth century.",
              "source":"Source acknowledgement: Wikimedia Commons / Azuchi Castle ruins."
            },
            "tokugawaEra": {
              "range":"1603–1868 • Tokugawa / Edo",
              "title":"Tokugawa: centralised warrior rule and long stability",
              "summary":"Ieyasu became shogun in 1603 and based the government in Edo. The Tokugawa kept daimyo and domains but imposed rules that limited independent military power.",
              "points":[
                "The shogunate controlled daimyo through castle rules, marriage controls and alternate attendance.",
                "Samurai increasingly served as administrators during long peace.",
                "Foreign contact was restricted but not completely eliminated."
              ],
              "image":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Samurai_old_photo_at_Tokyo_National_Museum.jpg/960px-Samurai_old_photo_at_Tokyo_National_Museum.jpg",
              "evidenceTitle":"Historical samurai photograph",
              "evidence":"This later photograph preserves the appearance of members of the warrior class near the end of the samurai era.",
              "source":"Source acknowledgement: Wikimedia Commons / Tokyo National Museum samurai photograph."
            },
            "meijiEra": {
              "range":"1868 onward • Meiji",
              "title":"Meiji: imperial restoration and rapid modernisation",
              "summary":"The Tokugawa shogunate collapsed in 1868. The new government centralised authority and rapidly reformed the military, industry, transport, education and social system.",
              "points":[
                "The old feudal class system was abolished and daimyo power was reduced.",
                "A national army replaced the samurai monopoly on fighting.",
                "Railways, factories and modern institutions expanded."
              ],
              "image":"https://upload.wikimedia.org/wikipedia/commons/0/0a/Emperor_Meiji_in_1873.jpg",
              "evidenceTitle":"Emperor Meiji in the early 1870s",
              "evidence":"Meiji-era portraits show the new government deliberately adopting and adapting modern military and political imagery.",
              "source":"Source acknowledgement: Wikimedia Commons / Emperor Meiji."
            }
          }

          safe_era = "const eraData=" + json.dumps(era, ensure_ascii=False, separators=(",", ":")) + ";"
          html, count = re.subn(
              r"const eraData=\{.*?\n\};\nconst eraImage=",
              safe_era + "\nconst eraImage=",
              html,
              flags=re.S
          )
          if count != 1:
              raise SystemExit(f"Could not safely replace eraData block: {count}")

          city = {
            "nara":"<b>Nara</b> — Japan's first permanent capital (710–794). It became a centre of centralised government and Buddhism.",
            "kyoto":"<b>Kyoto / Heian-kyo</b> — Imperial capital from 794 to 1868 and the heart of court culture.",
            "kamakura":"<b>Kamakura</b> — Political centre of the first shogunate under Minamoto no Yoritomo.",
            "edo":"<b>Edo / Tokyo</b> — Tokugawa government centre from 1603; renamed Tokyo after the Meiji Restoration.",
            "osaka":"<b>Osaka</b> — Major castle town and commercial centre, especially important in the rice trade.",
            "nagasaki":"<b>Nagasaki</b> — Major port for controlled foreign contact; nearby Dejima supported limited Dutch and Chinese trade."
          }
          safe_city = "const cityData=" + json.dumps(city, ensure_ascii=False, separators=(",", ":")) + ";"
          html, count = re.subn(
              r"const cityData=\{.*?\n\};\nfunction activateCity",
              safe_city + "\nfunction activateCity",
              html,
              flags=re.S
          )
          if count != 1:
              raise SystemExit(f"Could not safely replace cityData block: {count}")

          if "<noscript><style>.reveal" not in html:
              html = html.replace(
                  "</head>",
                  "<noscript><style>.reveal{opacity:1!important;transform:none!important;filter:none!important}</style></noscript></head>"
              )

          p.write_text(html, encoding="utf-8")
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          soup = BeautifulSoup(Path("index.html").read_text(encoding="utf-8"), "html.parser")
          Path("/tmp/site.js").write_text("\n".join(x.get_text() for x in soup.find_all("script")), encoding="utf-8")
          PY
          node --check /tmp/site.js

      - name: Commit repaired site
        run: |
          git config user.name "ChatGPT site repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix blank page after hero and repair interactive scripts"
          git push
