name: Make feudal society text white

on:
  push:
    paths:
      - ".github/workflows/white-feudal-text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply white text styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css='''<style id="feudal-list-white">
          #society .snapshot-card .card li,
          #society .snapshot-card .card li b {
            color: #ffffff !important;
          }
          </style>
          '''
          if 'id="feudal-list-white"' not in s:
              s=s.replace("</head>", css+"\n</head>", 1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make feudal society explanation text white"
          git push
