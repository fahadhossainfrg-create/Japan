name: Fix Japan render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Harden render fallback')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden page rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="HARDENED RENDER FALLBACK"
          css="""
          /* HARDENED RENDER FALLBACK — lesson content must remain visible even if JS fails */
          .reveal,.reveal.on{opacity:1!important;transform:none!important;filter:none!important;visibility:visible!important}
          .chapter,.chapter *{visibility:visible}
          .chapter{display:block!important}
          @media (prefers-reduced-motion:reduce){.reveal,.reveal.on{opacity:1!important;transform:none!important;filter:none!important}}
          """
          if marker not in s:
              if "</style>" in s:
                  s=s.replace("</style>", css+"\n</style>", 1)
              else:
                  s=s.replace("</head>", "<style>"+css+"</style></head>", 1)
          # Lower observer threshold and provide browser fallback.
          old="const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.12});document.querySelectorAll('.reveal').forEach(x=>io.observe(x));"
          new="if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.05});document.querySelectorAll('.reveal').forEach(x=>io.observe(x));}else{document.querySelectorAll('.reveal').forEach(x=>x.classList.add('on'));}"
          s=s.replace(old,new)
          # Safety net: show all lesson content even after an unrelated runtime error.
          if "renderSafetyNet" not in s:
              safety="""<script id="renderSafetyNet">
              function revealAll(){document.querySelectorAll('.reveal').forEach(function(el){el.style.opacity='1';el.style.transform='none';el.style.filter='none';el.style.visibility='visible';});}
              window.addEventListener('error',revealAll);
              document.addEventListener('DOMContentLoaded',revealAll);
              setTimeout(revealAll,500);
              </script>"""
              s=s.replace("</body>", safety+"</body>", 1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden render fallback"
          git push
