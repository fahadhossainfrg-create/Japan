name: Fix era evidence and geolocate city dots

on:
  push:
    paths:
      - ".github/workflows/fix-era-and-city-dots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild era explorer and calibrate city dots
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('index.html','utf8');

          const eraStart=s.indexOf('const eraData=');
          const eraEnd=s.indexOf('const eraImage=',eraStart);
          if(eraStart<0 || eraEnd<0) throw new Error('Era data block not found');
          const eraSource=s.slice(eraStart,eraEnd);

          function extractImage(key,nextKey){
            const a=eraSource.indexOf(key+':{');
            if(a<0) throw new Error('Missing era image block: '+key);
            const b=nextKey ? eraSource.indexOf(nextKey+':{',a+1) : eraSource.length;
            const block=eraSource.slice(a,b>0?b:eraSource.length);
            const m=block.match(/image:'(data:image\/[^']+)'/);
            if(!m) throw new Error('Embedded image not found for '+key);
            return m[1];
          }

          const order=[
            ['nara','Nara'],['heian','Heian'],['kamakura','Kamakura'],
            ['muromachi','Muromachi'],['sengoku','Warring States'],
            ['tokugawaEra','Tokugawa / Edo'],['meijiEra','Meiji']
          ];

          const meta={
            nara:{range:'710–794 • Nara period',title:'Nara: permanent capital and state Buddhism',summary:'Nara became Japan’s first permanent capital in 710. The court strengthened central government while Chinese and Korean influence shaped writing, administration and Buddhism.',points:['Nara became the imperial capital in 710.','Buddhism became closely connected with state authority.','Chinese writing and administrative models influenced government.'],evidenceTitle:'Nara-period evidence',evidence:'The visual source helps locate Nara within the early development of a permanent capital and a more centralised imperial state.'},
            heian:{range:'794–1185 • Heian period',title:'Heian: Kyoto, court culture and rising warrior power',summary:'The capital moved to Kyoto, then called Heian-kyo, in 794. Court culture flourished, but powerful families increasingly depended on armed retainers, helping warrior households gain influence.',points:['Kyoto became the imperial capital.','Court literature, ceremony and elite culture flourished.','Warrior families became more politically important toward the end of the era.'],evidenceTitle:'Heian-period historical source',evidence:'The source provides evidence for the cultural and political world that existed before warrior government became dominant.'},
            kamakura:{range:'1185–1333 • Kamakura shogunate',title:'Kamakura: Japan’s first long-lasting warrior government',summary:'Minamoto no Yoritomo established a military government based in Kamakura while the emperor remained in Kyoto. Political and military authority increasingly rested with the shogun and warrior elite.',points:['The shogun governed through the bakufu.','Samurai and warrior officials gained greater authority.','The government faced Mongol invasions in 1274 and 1281.'],evidenceTitle:'Minamoto no Yoritomo',evidence:'The historical depiction connects Yoritomo with the transfer of practical political power from the imperial court to warrior government.'},
            muromachi:{range:'1338–1573 • Muromachi / Ashikaga',title:'Muromachi: Ashikaga rule and stronger regional daimyo',summary:'The Ashikaga shogunate ruled from Kyoto. Over time, central authority weakened and regional daimyo became increasingly independent, while important cultural traditions continued to develop.',points:['The Ashikaga shogunate was based in Kyoto.','Daimyo gained greater regional independence.','Weakening central authority contributed to later civil conflict.'],evidenceTitle:'Military and political evidence',evidence:'The visual source provides context for the military pressures and regional power struggles that shaped medieval warrior rule.'},
            sengoku:{range:'c.1467–1600 • Warring States period',title:'Warring States: conflict, castles and the struggle for unification',summary:'Japan fragmented among competing daimyo. Warfare, alliances, castle building and firearms transformed politics before Oda Nobunaga, Toyotomi Hideyoshi and Tokugawa Ieyasu progressively unified the country.',points:['Daimyo fought for territory and influence.','Firearms changed battlefield tactics during the sixteenth century.','Tokugawa Ieyasu defeated major rivals at Sekigahara in 1600.'],evidenceTitle:'Warrior evidence from late medieval Japan',evidence:'The warrior imagery helps show the importance of armour, military identity and armed service during an age of prolonged conflict.'},
            tokugawaEra:{range:'1603–1868 • Tokugawa / Edo period',title:'Tokugawa: centralised warrior rule and long stability',summary:'Tokugawa Ieyasu became shogun in 1603 and based his government in Edo. Tokugawa rulers controlled daimyo, regulated society and restricted foreign contact while Japan experienced a long period of internal peace.',points:['Daimyo were controlled through rules and alternate attendance.','Many samurai became administrators during long peace.','Foreign contact was restricted but not completely eliminated.'],evidenceTitle:'Japanese image of Portuguese foreigners',evidence:'The image shows that foreign contact existed and helps explain why Tokugawa governments later regulated Christianity, overseas travel and trade.'},
            meijiEra:{range:'1868 onward • Meiji Restoration',title:'Meiji: the end of the shogunate and rapid modernisation',summary:'The Tokugawa shogunate fell in 1868 and imperial government was restored. Japan then rapidly changed its military, education, industry, transport and political institutions.',points:['The feudal political order was dismantled.','A national army and modern bureaucracy developed.','Foreign technology and institutions were adapted to Japanese goals.'],evidenceTitle:'Emperor Meiji',evidence:'The image presents the emperor in a modern military style, showing the new state’s changing public image after 1868.'}
          };

          const images={};
          order.forEach(([key],i)=>images[key]=extractImage(key,order[i+1]?.[0]));

          const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
          const inputs=[],labels=[],panels=[];
          order.forEach(([key,label],i)=>{
            const d=meta[key];
            inputs.push(`<input class="era-radio" type="radio" name="era-select" id="era-${key}"${i===0?' checked':''}>`);
            labels.push(`<label class="era-tab-css tab-${key}" for="era-${key}">${esc(label)}</label>`);
            const pts=d.points.map((pt,j)=>`<div class="era-point"><i>${j+1}</i><span>${esc(pt)}</span></div>`).join('');
            panels.push(`<article class="era-panel panel-${key}">
              <div class="era-image-wrap"><img src="${images[key]}" alt="${esc(d.evidenceTitle)}" loading="lazy"><div class="era-photo-label"><span>PICTURE EVIDENCE</span><b>${esc(d.evidenceTitle)}</b></div></div>
              <div class="era-copy"><div class="era-range">${esc(d.range)}</div><h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p><div class="era-points">${pts}</div><div class="evidence-note"><b>What the picture tells us</b><p>${esc(d.evidence)}</p><div class="era-source-note">Source acknowledgement: historical teaching image supplied for this experience.</div></div></div>
            </article>`);
          });

          const css=String.raw`
          <style id="era-css-only-fix">
          .era-css-only{margin-top:24px}.era-css-only .era-radio{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.era-css-only .era-tabbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}.era-css-only .era-tab-css{cursor:pointer;padding:11px 15px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(27,79,66,.16);font-weight:800;color:#254b42;transition:.2s ease;user-select:none}.era-css-only .era-tab-css:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.08)}.era-css-only .era-panel{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:stretch}.era-css-only .era-image-wrap{position:relative;min-height:470px;background:#ede7da;border-radius:24px;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.13)}.era-css-only .era-image-wrap img{width:100%;height:100%;min-height:470px;object-fit:cover;display:block}.era-css-only .era-photo-label{position:absolute;left:16px;bottom:16px;max-width:calc(100% - 32px);background:rgba(16,26,23,.9);color:#fff;padding:10px 13px;border-radius:13px}.era-css-only .era-photo-label span{display:block;font-size:.67rem;letter-spacing:.12em;opacity:.7;font-weight:800}.era-css-only .era-photo-label b{display:block;margin-top:3px}.era-css-only .era-copy{padding:25px;border-radius:24px;background:rgba(255,255,255,.86);border:1px solid rgba(27,79,66,.13)}.era-css-only .era-range{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#9a3412;margin-bottom:7px}.era-css-only .era-copy h3{font-size:clamp(1.65rem,2.3vw,2.35rem);margin:0 0 10px}.era-css-only .era-copy>p{line-height:1.7}.era-css-only .era-points{display:grid;gap:9px;margin:17px 0}.era-css-only .era-point{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}.era-css-only .era-point i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1f6c5b;color:#fff;font-style:normal;font-size:.78rem;font-weight:900}.era-css-only .evidence-note{margin-top:17px;padding:16px;border-radius:18px;background:#f4ecdd}.era-css-only .evidence-note>p{margin:7px 0 0;line-height:1.65}.era-css-only .era-source-note{margin-top:11px;font-size:.78rem;opacity:.78}
          .era-css-only #era-nara:checked~.era-shell .panel-nara,.era-css-only #era-heian:checked~.era-shell .panel-heian,.era-css-only #era-kamakura:checked~.era-shell .panel-kamakura,.era-css-only #era-muromachi:checked~.era-shell .panel-muromachi,.era-css-only #era-sengoku:checked~.era-shell .panel-sengoku,.era-css-only #era-tokugawaEra:checked~.era-shell .panel-tokugawaEra,.era-css-only #era-meijiEra:checked~.era-shell .panel-meijiEra{display:grid}
          .era-css-only #era-nara:checked~.era-shell .tab-nara,.era-css-only #era-heian:checked~.era-shell .tab-heian,.era-css-only #era-kamakura:checked~.era-shell .tab-kamakura,.era-css-only #era-muromachi:checked~.era-shell .tab-muromachi,.era-css-only #era-sengoku:checked~.era-shell .tab-sengoku,.era-css-only #era-tokugawaEra:checked~.era-shell .tab-tokugawaEra,.era-css-only #era-meijiEra:checked~.era-shell .tab-meijiEra{background:#1f6c5b;color:#fff;border-color:#1f6c5b;box-shadow:0 8px 20px rgba(31,108,91,.24)}
          @media(max-width:900px){.era-css-only .era-panel{grid-template-columns:1fr}.era-css-only .era-image-wrap,.era-css-only .era-image-wrap img{min-height:330px}.era-css-only .era-tabbar{gap:7px}.era-css-only .era-tab-css{padding:9px 11px;font-size:.86rem}}
          </style>`;

          if(!s.includes('id="era-css-only-fix"')) s=s.replace('</head>',css+'\n</head>');

          const section=`<section class="chapter jade" id="eras">
          <div class="kicker reveal">History Lens • Era Evidence Explorer</div>
          <h2 class="reveal">See the eras of Japan through surviving evidence.</h2>
          <p class="lead reveal">Choose an era to examine what changed, who held power and what the historical evidence can tell us. The tabs work without JavaScript.</p>
          <div class="era-css-only reveal">${inputs.join('')}<div class="era-shell"><div class="era-tabbar" role="tablist" aria-label="Japanese historical eras">${labels.join('')}</div><div class="era-panels">${panels.join('')}</div></div></div>
          <div class="era-overview reveal"><div><b>710</b><span>Nara capital</span></div><i></i><div><b>794</b><span>Kyoto / Heian</span></div><i></i><div><b>1185</b><span>Kamakura warrior rule</span></div><i></i><div><b>1338</b><span>Ashikaga rule</span></div><i></i><div><b>c.1467</b><span>Warring States</span></div><i></i><div><b>1603</b><span>Tokugawa shogunate</span></div><i></i><div><b>1868</b><span>Meiji Restoration</span></div></div>
          </section>`;

          const start=s.indexOf('<section class="chapter jade" id="eras">');
          const end=s.indexOf('</section>',start)+10;
          if(start<0||end<=start) throw new Error('Era section not found');
          s=s.slice(0,start)+section+s.slice(end);

          const old=s;
          s=s.replace(/\/\/ era evidence explorer[\s\S]*?\/\/ islands/,'// islands');
          if(s===old) throw new Error('Old era JavaScript block not found');

          const coords={
            kyoto:['41.41','71.11'],
            nara:['41.59','73.15'],
            osaka:['40.05','73.10'],
            edo:['61.43','66.86'],
            kamakura:['60.69','69.18'],
            nagasaki:['11.33','85.27']
          };
          for(const [key,[x,y]] of Object.entries(coords)){
            const re=new RegExp('(for="map-city-'+key+'" style=")left:[^;]+%;top:[^%]+%("[^>]*>)');
            const next=s.replace(re,'$1left:'+x+'%;top:'+y+'%$2');
            if(next===s) throw new Error('Could not update '+key);
            s=next;
          }

          fs.writeFileSync('index.html',s);
          NODE

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix era evidence explorer and geolocate city dots"
          git push
