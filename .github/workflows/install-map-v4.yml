name: Install self contained clickable Japan map

on:
  push:
    paths:
      - ".github/workflows/install-map-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download map asset into repository
        run: |
          mkdir -p assets
          curl -L --fail --retry 4 --retry-delay 2 -A "Mozilla/5.0"             "https://www.d-maps.com/m/asia/japan/japon/japon66.gif"             -o assets/japan_actual_map.gif
          test -s assets/japan_actual_map.gif

      - name: Install CSS-only interactive map
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          css=r"""
          <style id="actual-map-v4-css-only">
          .map-explorer.map-v4{display:block!important;margin:22px 0 30px}
          .map-v4 .city-radio{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
          .map-v4 .map-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.55fr);gap:22px;align-items:stretch}
          .map-v4 .map-canvas{position:relative;overflow:hidden;border-radius:24px;background:#78b9e5;border:1px solid rgba(31,64,94,.22);box-shadow:0 18px 42px rgba(31,41,55,.12)}
          .map-v4 .map-canvas>img{display:block;width:100%;height:auto;object-fit:contain;background:#78b9e5}
          .map-v4 .map-dot{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);cursor:pointer;z-index:10;border-radius:50%;display:block;touch-action:manipulation}
          .map-v4 .map-dot::before{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);border-radius:50%;background:#d71920;border:3px solid #fff;box-shadow:0 0 0 2px rgba(88,19,23,.28),0 4px 10px rgba(0,0,0,.3);transition:.16s ease}
          .map-v4 .map-dot::after{content:'';position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(215,25,32,.35);transition:.16s ease}
          .map-v4 .map-dot:hover::before,.map-v4 .map-dot:active::before{transform:translate(-50%,-50%) scale(1.25);background:#991b1b}
          .map-v4 .map-dot:hover::after,.map-v4 .map-dot:active::after{width:32px;height:32px;border-color:rgba(215,25,32,.65)}
          #map-city-kyoto:checked~.map-layout label[for="map-city-kyoto"]::before,
          #map-city-nara:checked~.map-layout label[for="map-city-nara"]::before,
          #map-city-osaka:checked~.map-layout label[for="map-city-osaka"]::before,
          #map-city-edo:checked~.map-layout label[for="map-city-edo"]::before,
          #map-city-kamakura:checked~.map-layout label[for="map-city-kamakura"]::before,
          #map-city-nagasaki:checked~.map-layout label[for="map-city-nagasaki"]::before{background:#6b0f12;transform:translate(-50%,-50%) scale(1.3);box-shadow:0 0 0 5px rgba(215,25,32,.2),0 5px 12px rgba(0,0,0,.32)}
          .map-v4 .map-credit{padding:11px 14px;background:rgba(255,255,255,.94);font-size:.79rem;line-height:1.45;color:#334155;border-top:1px solid rgba(31,64,94,.12)}
          .map-v4 .city-card{display:flex;flex-direction:column;min-height:100%;padding:22px}
          .map-v4 .map-instruction{padding:11px 13px;margin:0 0 14px;border-radius:14px;background:#f6efe4;color:#63492d;line-height:1.5}
          .map-v4 .city-details{flex:1;min-height:310px;padding:22px;border-radius:20px;background:linear-gradient(145deg,#fff,#f7f1e6);border:1px solid rgba(148,103,43,.18)}
          .map-v4 .city-detail{display:none}.map-v4 .city-default{display:block;color:#554839;line-height:1.6}
          #map-city-kyoto:checked~.map-layout .city-default,
          #map-city-nara:checked~.map-layout .city-default,
          #map-city-osaka:checked~.map-layout .city-default,
          #map-city-edo:checked~.map-layout .city-default,
          #map-city-kamakura:checked~.map-layout .city-default,
          #map-city-nagasaki:checked~.map-layout .city-default{display:none}
          #map-city-kyoto:checked~.map-layout .detail-kyoto,
          #map-city-nara:checked~.map-layout .detail-nara,
          #map-city-osaka:checked~.map-layout .detail-osaka,
          #map-city-edo:checked~.map-layout .detail-edo,
          #map-city-kamakura:checked~.map-layout .detail-kamakura,
          #map-city-nagasaki:checked~.map-layout .detail-nagasaki{display:block}
          .map-v4 .city-kicker{display:inline-block;margin-bottom:8px;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a3412}
          .map-v4 .city-detail h3{font-size:1.65rem;margin:0 0 5px;color:#2e241a}.map-v4 .city-period{font-size:.9rem;font-weight:700;color:#785f40;margin-bottom:14px}
          .map-v4 .city-detail h4{font-size:.84rem;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em;color:#9a3412}.map-v4 .city-detail p{margin:0;color:#504336;line-height:1.62}
          @media(max-width:900px){.map-v4 .map-layout{grid-template-columns:1fr}.map-v4 .city-details{min-height:250px}.map-v4 .map-dot{width:34px;height:34px}.map-v4 .map-dot::before{width:11px;height:11px}}
          </style>
          """
          if 'id="actual-map-v4-css-only"' not in s:
              s=s.replace("</head>",css+"\n</head>",1)

          block=r"""
          <div class="map-explorer map-v4 reveal">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-kyoto">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-nara">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-osaka">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-edo">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-kamakura">
            <input class="city-radio" type="radio" name="historic-city" id="map-city-nagasaki">
            <div class="map-layout">
              <div class="map-canvas">
                <img src="assets/japan_actual_map.gif" alt="Geographic map of Japan and nearby East Asian coastline">
                <label class="map-dot" for="map-city-kyoto" style="left:43.1%;top:67.0%" aria-label="Reveal historical city"></label>
                <label class="map-dot" for="map-city-nara" style="left:44.1%;top:69.1%" aria-label="Reveal historical city"></label>
                <label class="map-dot" for="map-city-osaka" style="left:41.6%;top:69.1%" aria-label="Reveal historical city"></label>
                <label class="map-dot" for="map-city-edo" style="left:62.0%;top:63.0%" aria-label="Reveal historical city"></label>
                <label class="map-dot" for="map-city-kamakura" style="left:61.6%;top:65.0%" aria-label="Reveal historical city"></label>
                <label class="map-dot" for="map-city-nagasaki" style="left:8.1%;top:81.5%" aria-label="Reveal historical city"></label>
                <div class="map-credit"><b>Interactive historical map:</b> click a red dot placed directly on the geographic map. The city name appears only after selection. Map source acknowledged: d-maps.com; the image is stored inside this GitHub repository.</div>
              </div>
              <div class="card city-card">
                <h3>Key Cities of Historical Japan</h3>
                <div class="map-instruction"><b>Click any red dot on Japan.</b> The name, historical period, significance and history will appear below. The map works without JavaScript.</div>
                <div class="city-details">
                  <div class="city-default"><b>Select a red dot on the map.</b><br><br>Nothing is labelled in advance. Choose a location to reveal which historical city it represents.</div>
                  <article class="city-detail detail-kyoto"><span class="city-kicker">Map discovery</span><h3>Kyoto / Heian-kyo</h3><div class="city-period">Imperial capital • 794–1868</div><h4>Why it mattered</h4><p>Kyoto became the centre of the imperial court and one of Japan’s most important cultural and political cities.</p><h4>History</h4><p>The capital moved here in 794. Court culture flourished during the Heian period. Even after military governments gained power elsewhere, the emperor and imperial court remained in Kyoto until the Meiji Restoration.</p></article>
                  <article class="city-detail detail-nara"><span class="city-kicker">Map discovery</span><h3>Nara</h3><div class="city-period">Imperial capital • 710–794</div><h4>Why it mattered</h4><p>Nara was Japan’s first permanent capital and a major centre of Buddhism and centralised imperial government.</p><h4>History</h4><p>The city was planned with strong influence from Chinese models. Major Buddhist temples connected religion with imperial authority, and Nara became important for administration, scholarship and state Buddhism.</p></article>
                  <article class="city-detail detail-osaka"><span class="city-kicker">Map discovery</span><h3>Osaka</h3><div class="city-period">Castle town & commercial centre</div><h4>Why it mattered</h4><p>Osaka became strategically important during unification and later developed into a major centre of trade and the rice economy.</p><h4>History</h4><p>Toyotomi Hideyoshi built Osaka Castle as a major military and political base. Under Tokugawa rule, Osaka became a commercial hub where rice and other goods were exchanged on a large scale.</p></article>
                  <article class="city-detail detail-edo"><span class="city-kicker">Map discovery</span><h3>Edo / Tokyo</h3><div class="city-period">Tokugawa government • 1603–1868</div><h4>Why it mattered</h4><p>Edo was the headquarters of the Tokugawa shogunate and grew into a huge political and urban centre.</p><h4>History</h4><p>Tokugawa Ieyasu based his government in Edo. Daimyo travelled there under alternate-attendance rules. After the Meiji Restoration, Edo was renamed Tokyo and became the imperial capital.</p></article>
                  <article class="city-detail detail-kamakura"><span class="city-kicker">Map discovery</span><h3>Kamakura</h3><div class="city-period">First shogunate centre • from 1185</div><h4>Why it mattered</h4><p>Kamakura was the political centre of Japan’s first long-lasting warrior government.</p><h4>History</h4><p>Minamoto no Yoritomo established his military government here, away from the imperial court in Kyoto. The Kamakura bakufu used warrior officials, land stewards and military protectors to govern.</p></article>
                  <article class="city-detail detail-nagasaki"><span class="city-kicker">Map discovery</span><h3>Nagasaki</h3><div class="city-period">Foreign-contact port • Tokugawa era</div><h4>Why it mattered</h4><p>Nagasaki was one of Japan’s most important gateways for controlled contact with foreign traders.</p><h4>History</h4><p>After the shogunate tightened overseas restrictions, limited Dutch and Chinese trade continued through Nagasaki. Dejima in Nagasaki harbour became especially important for controlled Dutch trade and the transfer of some Western knowledge.</p></article>
                </div>
              </div>
            </div>
          </div>
          """

          pat=r'<div class="map-explorer(?: actual-map| map-v4)? reveal">.*?</div>\s*<div class="knowledge reveal"><h3>Know Japan before you enter the shogunate</h3>'
          s,n=re.subn(pat,block+'\n<div class="knowledge reveal"><h3>Know Japan before you enter the shogunate</h3>',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit("Could not locate map block")

          s=re.sub(r'\nconst cityData=\{.*?document\.querySelectorAll\(\'\.city-hotspot\'\)\.forEach\(btn=>btn\.addEventListener\(\'click\',\(\)=>activateCity\(btn\.dataset\.city\)\)\);\n','\n',s,count=1,flags=re.S)
          s=s.replace("document.querySelectorAll('.city-hotspot').forEach(x=>x.classList.remove('active'));document.getElementById('cityDrawer').innerHTML='<b>Select a red dot on Japan.</b><br><br>The city name and description will appear here only after you click.';","")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit map and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/japan_actual_map.gif
          git commit -m "Install self contained clickable Japan map"
          git push
